<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GOLDIX DROP — Standoff 2 Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background: #0c0d14; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px 10px; }
    
    .header { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #161824; padding: 10px 15px; border-radius: 14px; border: 1px solid rgba(255,183,3,0.2); }
    .logo { font-size: 18px; font-weight: 900; color: #ffb703; text-shadow: 0 0 10px rgba(255,183,3,0.5); letter-spacing: 1px; }
    .balance { background: #222638; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #ffd700; border: 1px solid #ffb703; display: flex; align-items: center; gap: 5px; }

    .case-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; color: #fff; }

    .roulette-wrapper { position: relative; width: 100%; max-width: 380px; height: 140px; background: #131520; border: 2px solid #282b3d; border-radius: 16px; overflow: hidden; margin-bottom: 20px; box-shadow: inset 0 0 25px rgba(0,0,0,0.8); }
    .pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #ff3366; z-index: 10; box-shadow: 0 0 12px #ff3366; }
    .roulette-track { display: flex; align-items: center; height: 100%; position: absolute; left: 0; transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1); }
    
    .item-card { min-width: 110px; height: 110px; background: #1a1d2b; margin: 0 5px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid #888; flex-shrink: 0; font-size: 11px; text-align: center; padding: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .item-card.arcane { border-color: #e63946; background: linear-gradient(180deg, #1a1d2b 0%, rgba(230, 57, 70, 0.25) 100%); }
    .item-card.legendary { border-color: #ffb703; background: linear-gradient(180deg, #1a1d2b 0%, rgba(255, 183, 3, 0.25) 100%); }
    .item-card.epic { border-color: #9d4edd; background: linear-gradient(180deg, #1a1d2b 0%, rgba(157, 78, 221, 0.25) 100%); }
    
    .item-icon { font-size: 28px; margin-bottom: 6px; }
    .item-name { font-weight: 700; color: #eee; line-height: 1.2; }

    .spin-btn { width: 100%; max-width: 380px; padding: 18px; border: none; border-radius: 14px; background: linear-gradient(90deg, #ff9e00, #ff5000); color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 5px 25px rgba(255, 80, 0, 0.4); transition: all 0.2s; letter-spacing: 1px; }
    .spin-btn:active { transform: scale(0.97); }
    .spin-btn:disabled { opacity: 0.6; filter: grayscale(1); }

    .win-modal { margin-top: 15px; font-size: 16px; color: #4eef90; font-weight: bold; min-height: 30px; text-align: center; text-shadow: 0 0 10px rgba(78,239,144,0.4); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">⚡️ GOLDIX DROP</div>
    <div class="balance">🪙 <span id="userBalance">500</span> G</div>
  </div>

  <div class="case-title">🔪 ЭЛИТНЫЙ КЕЙС НОЖЕЙ</div>

  <div class="roulette-wrapper">
    <div class="pointer"></div>
    <div class="roulette-track" id="track"></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">Открыть за 100 G</button>
  <div class="win-modal" id="winText"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 500;
    const items = [
      { name: "M9 Bayonet 'Dragon Glass'", class: "arcane", icon: "🗡️" },
      { name: "Karambit 'Gold'", class: "arcane", icon: "🔪" },
      { name: "Butterfly 'Legacy'", class: "legendary", icon: "🦋" },
      { name: "Gloves 'Champion'", class: "legendary", icon: "🥊" },
      { name: "AKR 'Treasure Hunter'", class: "epic", icon: "🔫" },
      { name: "AWM 'Sport'", class: "epic", icon: "🎯" }
    ];

    const track = document.getElementById('track');
    const spinBtn = document.getElementById('spinBtn');
    const winText = document.getElementById('winText');
    const userBalance = document.getElementById('userBalance');

    function initTrack() {
      track.innerHTML = '';
      for (let i = 0; i < 70; i++) {
        const item = items[Math.floor(Math.random() * items.length)];
        const card = document.createElement('div');
        card.className = `item-card ${item.class}`;
        card.innerHTML = `
          <div class="item-icon">${item.icon}</div>
          <div class="item-name">${item.name}</div>
        `;
        track.appendChild(card);
      }
    }

    initTrack();

    function spin() {
      if (balance < 100) {
        winText.style.color = '#ff3366';
        winText.innerText = '❌ Недостаточно голды!';
        return;
      }

      balance -= 100;
      userBalance.innerText = balance;

      spinBtn.disabled = true;
      winText.innerText = '';
      initTrack();

      const itemWidth = 120;
      const winningIndex = 45 + Math.floor(Math.random() * 10);
      const offset = (winningIndex * itemWidth) - 130; 

      track.style.transition = 'transform 5s cubic-bezier(0.1, 1, 0.1, 1)';
      track.style.transform = `translateX(-${offset}px)`;

      setTimeout(() => {
        const winItem = items[Math.floor(Math.random() * items.length)];
        winText.style.color = '#4eef90';
        winText.innerText = `🎉 Твой дроп: ${winItem.name}!`;
        spinBtn.disabled = false;
        
        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
      }, 5000);
    }
  </script>
</body>
</html>
